[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "icslint"
version = "0.1.0"
description = "Command-line checker for .ics calendar files with precise line/column error messages"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "mggarcia6" }]

[project.scripts]
icslint = "icslint.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["icslint*"]
